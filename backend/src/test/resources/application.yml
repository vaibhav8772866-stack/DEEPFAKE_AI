spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret-change-this-jwt-secret}
    expiration-ms: 86400000
  ai:
    model-path: ../ai-model/models/model_q4.onnx
    cascade-path: ../ai-model/models/haarcascade_frontalface_default.xml
    input-width: 224
    input-height: 224
