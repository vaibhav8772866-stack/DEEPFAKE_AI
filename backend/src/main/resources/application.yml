spring:
  application:
    name: sentinel-backend-test

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret-change-this-jwt-secret}
    expiration-ms: 86400000

  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-email: ${ADMIN_EMAIL:admin@sentinel.ai}
    default-password: ${ADMIN_PASSWORD:change-this-password}